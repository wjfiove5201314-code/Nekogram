Name: Build

on:
  push:
    branches: [ "main", "dev", "ci" ]
    paths-ignore:
      - '**.md'
      - '.github/**'
      - '!.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    # 修改 1：换成 GitHub 官方免费的标准 Linux 服务器，立刻解决 Queued 死锁问题
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up ccache
        uses: Chocobo1/setup-ccache-action@v1
        with:
          remove_stale_cache: false

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "build-tools;34.0.0 ndk;26.1.10909125 platforms;android-34"

      - name: Configure Gradle
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.caching=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.parallel=true' >> ~/.gradle/gradle.properties
          echo 'org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC' >> ~/.gradle/gradle.properties

      # 修改 2：简化签名与 Secrets，注入空配置防止未定义报错
      - name: Configure Dummy Secrets
        run: |
          touch local.properties
          echo "apiId=1097" >> local.properties
          echo "apiHash=b682142d58a628d005f329971932371b" >> local.properties
          
          mkdir -p TMessagesProj_App
          echo '{}' > TMessagesProj_App/google-services.json

      # 修改 3：只编译免签名的 Debug 版本 APK，速度最快且无需配置任何密匙
      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --continue

      # 修改 4：上传编译成功的 Debug APK 到 Artifacts
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-Telegram-APK
          path: TMessagesProj_App/build/outputs/apk/debug/*.apk
